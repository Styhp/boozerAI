/* Boozer AI — component styles. Load after tokens.css. Every value reads a token;
   the only literals are 1px rules, the glass blur radii (Athelstan restrained level)
   and the dotted/dashed border styles that carry provenance. */

.bz, .bz * { box-sizing: border-box; }
.bz {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
:where(.bz) button { font: inherit; color: inherit; }
.bz :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.bz code, .bz .bz-path { font-family: var(--font-mono); }

/* ── Ground: canvas with Athelstan's "no wallpaper" light pools ───────────── */
.bz-ground {
  background:
    radial-gradient(880px 420px at 20% -10%, color-mix(in srgb, var(--brand) 9%, transparent), transparent 70%),
    radial-gradient(720px 380px at 86% -6%, color-mix(in srgb, var(--fact-ink) 8%, transparent), transparent 72%),
    var(--canvas);
}

/* ── Glass chrome (restrained). Material on ::before so popovers still refract. */
.bz-glass { position: relative; isolation: isolate; }
.bz-glass::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: var(--glass-chrome);
  -webkit-backdrop-filter: blur(12px) saturate(1.3);
  backdrop-filter: blur(12px) saturate(1.3);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .bz-glass::before { background: var(--surface-navigation); }
}
@media (prefers-reduced-transparency: reduce) {
  .bz-glass::before { background: var(--surface-navigation); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* ── Masthead ──────────────────────────────────────────────────────────── */
.bz-masthead {
  height: var(--masthead-height);
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center; gap: var(--space-3); padding: 0 var(--space-4);
  border-bottom: 1px solid var(--glass-rim);
  box-shadow: var(--shadow-medium);
}
.bz-identity { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.bz-wordmark { font-weight: 700; letter-spacing: -0.02em; font-size: 15px; white-space: nowrap; }
.bz-wordmark b { color: var(--brand-ink); font-weight: 700; }
.bz-divider { width: 1px; height: 18px; background: var(--glass-rule); flex: 0 0 1px; }
.bz-project { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.bz-project strong { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bz-project small { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bz-pills {
  display: flex; gap: 4px; padding: 3px; border-radius: 11px;
  background: var(--glass-hover); box-shadow: inset 0 0 0 1px var(--glass-rim);
}
.bz-pill {
  position: relative; height: 32px; display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; border: 0; border-radius: var(--glass-radius-control); background: transparent;
  color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.bz-pill:hover { background: var(--glass-hover); color: var(--text); }
.bz-pill[aria-current="page"] {
  background: var(--glass-selected); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--glass-rim), var(--shadow-subtle);
}
.bz-pill[aria-current="page"]::after {
  content: ""; position: absolute; bottom: 4px; left: 50%; width: 14px; height: 2px; margin-left: -7px;
  border-radius: 2px; background: var(--brand);
}
.bz-pill .bz-count { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.bz-context { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); min-width: 0; }

/* Where-data-goes chip. Always visible; it is the local-first promise in one glance. */
.bz-locality {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  font-size: 12.5px; color: var(--text-secondary); cursor: pointer; white-space: nowrap;
}
.bz-locality i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: 0 0 7px; }
.bz-locality[data-tone="external"] { border-color: var(--external-ink); color: var(--external-ink); }
.bz-locality[data-tone="external"] i { background: var(--external-ink); }

/* ── Buttons ───────────────────────────────────────────────────────────── */
.bz-btn {
  height: var(--control-height); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 14px; border-radius: var(--glass-radius-button); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; text-decoration: none;
}
.bz-btn:hover { background: var(--surface-selected); }
.bz-btn--primary {
  height: 40px; padding: 0 18px; border-color: transparent; background: var(--brand); color: var(--on-brand);
  font-weight: 600; box-shadow: var(--shadow-subtle);
}
.bz-btn--primary:hover { background: var(--brand-strong); }
.bz-btn--quiet { border-color: transparent; background: transparent; color: var(--brand-ink); padding: 0 8px; }
.bz-btn--quiet:hover { background: var(--brand-subtle); }
.bz-btn--external { border-color: var(--external-ink); color: var(--external-ink); }
.bz-btn--danger { border-color: var(--danger-ink); color: var(--danger-ink); }
.bz-btn:disabled { opacity: .55; cursor: default; }
.bz-btn svg, .bz-pill svg, .bz-locality svg { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.bz-link {
  border: 0; background: none; padding: 0; color: var(--brand-ink); cursor: pointer; text-align: left;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.bz-link.bz-path { font-size: 14px; font-weight: 500; }

/* Segmented control (List | Map, depth steps) */
.bz-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--surface-subtle); box-shadow: inset 0 0 0 1px var(--border); }
.bz-seg button {
  height: 28px; padding: 0 12px; border: 0; border-radius: var(--glass-radius-control); background: transparent;
  color: var(--text-muted); font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.bz-seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }

/* ── Provenance tags: the word carries the meaning; ink and border style back it up ── */
.bz-tag {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px;
  border-radius: var(--radius-chip); font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1;
  border: 1px solid currentColor;
}
.bz-tag svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.bz-tag--fact { color: var(--fact-ink); background: var(--fact-subtle); border-style: solid; }
.bz-tag--ai { color: var(--ai-ink); background: var(--ai-subtle); border-style: dashed; }
.bz-tag--note { color: var(--note-ink); background: var(--note-paper); border-style: solid; }
.bz-tag--gap { color: var(--gap-ink); background: var(--gap-subtle); border-style: dotted; }
.bz-tag--danger { color: var(--danger-ink); background: var(--danger-subtle); }
.bz-tag--external { color: var(--external-ink); background: var(--gap-subtle); }
.bz-tag--plain { color: var(--text-muted); background: var(--surface-subtle); border-color: var(--border); font-weight: 500; }
.bz-tag--type { color: var(--text-secondary); background: var(--surface-subtle); border-style: dashed; border-color: var(--text-muted); font-weight: 500; }

/* ── Reading surfaces ──────────────────────────────────────────────────── */
.bz-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--glass-radius-surface);
  box-shadow: var(--shadow-subtle); padding: var(--space-5);
}
.bz-card + .bz-card { margin-top: var(--space-4); }
.bz-q { font-size: 18px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 var(--space-2); }
.bz-q-sub { font-size: 15px; line-height: 1.4; font-weight: 600; margin: 0 0 var(--space-2); }
.bz-read { font-size: 16px; line-height: 1.6; max-width: var(--reading-max); }
.bz-lead { font-size: 18px; line-height: 1.55; max-width: var(--reading-max); }
.bz-meta { font-size: 12.5px; color: var(--text-muted); }
.bz-hint { font-size: 14px; line-height: 1.5; color: var(--text-secondary); max-width: var(--reading-max); }
.bz-label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); }
.bz-row-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); justify-content: space-between; }

/* Notices */
.bz-notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-surface);
  font-size: 14px; line-height: 1.5; border: 1px solid var(--border); background: var(--surface-subtle);
}
.bz-notice svg { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.bz-notice--gap { border: 1px dotted var(--gap-ink); background: var(--gap-subtle); }
.bz-notice--gap > svg { color: var(--gap-ink); }
.bz-notice--danger { border-color: var(--danger-ink); background: var(--danger-subtle); }
.bz-notice--danger > svg { color: var(--danger-ink); }
.bz-notice--external { border: 1px solid var(--external-ink); background: var(--gap-subtle); }
.bz-notice--external > svg { color: var(--external-ink); }
.bz-notice strong { font-weight: 600; }

/* Glossary term: dotted underline, opens a short definition */
.bz-term { border: 0; background: none; padding: 0; color: inherit; cursor: help; text-decoration: underline dotted; text-decoration-color: var(--text-muted); text-underline-offset: 3px; }
.bz-pop {
  position: absolute; z-index: 50; max-width: 300px; padding: 12px 14px; border-radius: var(--glass-radius-overlay);
  background: var(--surface-elevated); border: 1px solid var(--border); box-shadow: var(--shadow-elevated);
  font-size: 14px; line-height: 1.5; color: var(--text);
}
.bz-pop b { display: block; margin-bottom: 2px; }
.bz-pop small { display: block; margin-top: 6px; color: var(--text-muted); font-size: 12.5px; }

/* ── Coverage / gaps strip ─────────────────────────────────────────────── */
.bz-gaps { border: 1px dotted var(--gap-ink); background: var(--gap-subtle); border-radius: var(--glass-radius-surface); padding: var(--space-4) var(--space-5); }
.bz-gaps--clear { border: 1px solid var(--border); background: var(--surface); }
.bz-gaps h3 { margin: 0 0 4px; font-size: 15px; }
.bz-gaps ul { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: grid; gap: 6px; }
.bz-gaps li { display: grid; grid-template-columns: 3.2em 1fr; gap: var(--space-2); font-size: 14px; line-height: 1.45; align-items: baseline; }
.bz-gaps li > b { color: var(--gap-ink); font-variant-numeric: tabular-nums; text-align: right; font-size: 16px; }
.bz-gaps--clear li > b { color: var(--text); }
.bz-gaps li span small { display: block; color: var(--text-muted); font-size: 12.5px; }

/* Facts row: parser counts with their tag */
.bz-facts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; padding: 10px 12px; border-radius: var(--radius-surface); background: var(--fact-subtle); border: 1px solid color-mix(in srgb, var(--fact-ink) 35%, transparent); font-size: 14px; }
.bz-facts b { font-variant-numeric: tabular-nums; }

/* ── File panel / list ─────────────────────────────────────────────────── */
.bz-panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--glass-rim); }
.bz-panel-head { padding: var(--space-3) var(--space-3) var(--space-2); display: grid; gap: var(--space-2); }
.bz-search {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font: inherit; font-size: 13.5px;
}
.bz-search::placeholder { color: var(--text-muted); }
.bz-list { list-style: none; margin: 0; padding: 0 var(--space-2) var(--space-3); overflow: auto; min-height: 0; }
.bz-group { margin: var(--space-3) var(--space-2) 4px; }
.bz-file {
  width: 100%; min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border: 0; border-radius: var(--glass-radius-small); background: transparent; text-align: left; cursor: pointer;
  color: var(--text-secondary); font-family: var(--font-mono); font-size: 13px;
}
.bz-file:hover { background: var(--glass-hover); color: var(--text); }
.bz-file[aria-current="true"] { background: var(--glass-tint); color: var(--brand-ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--brand); }
.bz-file .bz-fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.bz-file .bz-fname span { direction: ltr; unicode-bidi: plaintext; }
.bz-file .bz-flag { font-family: var(--font-sans); font-size: 11px; font-weight: 600; flex: 0 0 auto; }
.bz-file .bz-flag--gap { color: var(--gap-ink); }
.bz-file .bz-flag--danger { color: var(--danger-ink); }
.bz-file .bz-flag--start { color: var(--text-muted); font-weight: 500; }

/* ── Connections ───────────────────────────────────────────────────────── */
.bz-conn { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.bz-conn-col { border: 1px solid var(--border); border-radius: var(--radius-surface); background: var(--surface-subtle); padding: var(--space-3); min-width: 0; }
.bz-conn-col h4 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.bz-conn-col h4 svg { width: 18px; height: 18px; fill: none; stroke: var(--fact-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.bz-conn-col > p { margin: 0 0 var(--space-2); font-size: 13px; color: var(--text-muted); }
.bz-conn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.bz-conn-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 7px 4px; border-top: 1px solid var(--border-inner); }
.bz-conn-list li:first-child { border-top: 0; }
.bz-conn-list .bz-line { margin-left: auto; font-size: 12.5px; }
.bz-pkgs { margin-top: var(--space-2); font-size: 13px; color: var(--text-muted); }
.bz-pkgs code { font-size: 12.5px; color: var(--text-secondary); }

/* ── Explanation (AI) block ────────────────────────────────────────────── */
.bz-ai { border: 1px dashed var(--ai-ink); border-radius: var(--glass-radius-surface); background: var(--surface); padding: var(--space-4) var(--space-5); }
.bz-ai-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: var(--space-3); }
.bz-ai-head .bz-meta { margin-left: auto; }
.bz-ai .bz-lead { margin: 0 0 var(--space-3); }
.bz-ai p, .bz-ai li { font-size: 16px; line-height: 1.6; }
.bz-ai ul { padding-left: 1.2em; margin: var(--space-2) 0; }

const GM = { nodes: [], byId: new Map(), links: [], alpha: 1 };

function syncModel(keepBorn) {
  const g = G(); const old = GM.byId; const nodes = []; const byId = new Map();
  const mk = (id, kind, label, extra) => { const o = old.get(id); const n = o || { id, x: (Math.random() - 0.5) * 80, y: (Math.random() - 0.5) * 80, vx: 0, vy: 0, a: 0, born: keepBorn ? 0 : Infinity, fx: null, fy: null }; Object.assign(n, { kind, label }, extra || {}); nodes.push(n); byId.set(id, n); return n; };

  for (const e of g.edges) {
    if (e.target.type === 'package' && !byId.has(nodeIdOf(e))) mk(nodeIdOf(e), 'pkg', e.target.name);
    if ((e.target.type === 'unresolved' || e.target.type === 'excluded') && !byId.has(nodeIdOf(e))) mk(nodeIdOf(e), 'gap', e.spec, { reason: e.target.reason });
  }
  GM.nodes = nodes; GM.byId = byId;
  GM.links = g.edges.map((e) => ({ e, s: byId.get(e.from), t: byId.get(nodeIdOf(e)), type: e.kind === 'type-import', born: 0 })).filter((l) => l.s && l.t);

app.addEventListener('click', (ev) => {
